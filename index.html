<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: https:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>RCE Jornal do Exército Brasileiro do Yso</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a0a0a;--pn:#141414;--ln:#2a2a2a;--tx:#f2f2f2;--mu:#9a9a9a;--rd:#e11d2e;--w:#fff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Barlow,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.cat,nav a,.btn{font-family:'Barlow Condensed',Impact,sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
#sp{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px;animation:sp 3.2s forwards}
#sp img{width:110px;height:110px;object-fit:contain;filter:grayscale(1) contrast(1.2);animation:pop 1.4s both}
#sp b{font:800 clamp(22px,6vw,40px)/1.05 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase;animation:up 1.2s .5s both}
#sp small{color:var(--mu);letter-spacing:.3em;font-size:12px;text-transform:uppercase;animation:up 1.2s 1s both}
#sp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
@keyframes sp{0%,80%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 20px;background:#000;border-bottom:1px solid var(--ln);font-size:13px;color:var(--mu)}
.btn{background:var(--w);color:#000;border:0;padding:8px 16px;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:.15s}
.btn:hover{background:#ccc}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.g:hover{border-color:var(--w)}.btn.d{background:var(--rd);color:#fff}
.btn:disabled{opacity:.5}
.mast{display:flex;align-items:center;gap:16px;justify-content:center;padding:22px 16px;text-align:left}
.mast img{width:64px;height:64px;object-fit:contain;filter:grayscale(1) contrast(1.2)}
.mast h1{font-size:clamp(24px,5.5vw,48px);line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.mast small{display:block;color:var(--mu);letter-spacing:.25em;font-size:12px;text-transform:uppercase;margin-bottom:4px}
nav{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-top:3px solid var(--w);border-bottom:1px solid var(--ln);display:flex;gap:4px;overflow-x:auto;padding:0 12px;justify-content:center;scrollbar-width:none}
nav a{padding:12px 14px;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
nav a:hover,nav a.on{border-bottom-color:var(--rd)}
.tk{display:none;background:var(--rd);color:#fff;overflow:hidden;white-space:nowrap}
.tk.on{display:flex}
.tk b{background:#000;padding:6px 14px;font:700 15px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;z-index:1}
.tk div{display:inline-block;padding:6px 0;animation:tk 30s linear infinite;padding-left:100%}
.tk a{margin-right:60px;font-weight:600}
@keyframes tk{to{transform:translateX(-100%)}}
main{max-width:1180px;margin:0 auto;padding:24px 16px 80px;animation:up .5s both}
.sr{display:flex;gap:8px;margin-bottom:22px}
input,select,textarea{width:100%;background:#000;color:var(--tx);border:1px solid var(--ln);padding:10px 12px;font:inherit;border-radius:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--w);outline-offset:2px}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-bottom:34px}
.lead{position:relative;display:block;overflow:hidden;min-height:420px;background:var(--pn);border:1px solid var(--ln)}
.lead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1);transition:transform .6s}
.lead:hover img{transform:scale(1.04)}
.lead .ov{position:absolute;inset:0;background:linear-gradient(0deg,#000 5%,rgba(0,0,0,.2) 70%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.lead h2{font-size:clamp(28px,4.5vw,46px);line-height:1.02;font-weight:800;margin:8px 0}
.cat{color:var(--rd);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px}
.mu{color:var(--mu);font-size:13px}
.side{display:flex;flex-direction:column}
.side h3.t,.sec{font-size:22px;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--w);padding-bottom:6px;margin-bottom:14px}
.ml{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.ml i{font:800 34px/1 'Barlow Condensed';color:var(--ln);font-style:normal;min-width:30px}
.ml a{font-weight:600;line-height:1.25}.ml a:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.cd{background:var(--pn);border:1px solid var(--ln);display:block;transition:.2s}
.cd:hover{transform:translateY(-4px);border-color:var(--w)}
.cd img,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;filter:grayscale(1);background:repeating-linear-gradient(45deg,#111,#111 10px,#181818 10px,#181818 20px)}
.cd div{padding:14px}
.cd h3{font-size:24px;line-height:1.08;margin:4px 0 6px}
.cd p{color:var(--mu);font-size:14px}
.art{max-width:760px;margin:0 auto}
.art h1{font-size:clamp(34px,6vw,58px);line-height:1;font-weight:800;margin:8px 0 12px}
.art .sub{font:400 21px/1.35 'Source Serif 4',Georgia,serif;color:#cfcfcf;margin-bottom:16px}
.art .by{border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:10px 0;margin-bottom:20px;color:var(--mu);font-size:14px}
.art img{width:100%;filter:grayscale(1);margin-bottom:22px}
.art p{font:400 19px/1.75 'Source Serif 4',Georgia,serif;margin-bottom:18px}
.box{background:var(--pn);border:1px solid var(--ln);padding:18px;margin-bottom:16px}
.box label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px;color:var(--mu)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ck{display:flex;gap:8px;align-items:center;margin-top:12px}.ck input{width:auto}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--ln);padding:1px 7px;color:var(--mu);text-transform:uppercase}
.tag.r{border-color:var(--rd);color:var(--rd)}
#ts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--w);color:#000;padding:10px 18px;font-weight:600;z-index:60;display:none;max-width:90vw}
footer{border-top:1px solid var(--ln);padding:26px 16px;text-align:center;color:var(--mu);font-size:13px}
.emp{text-align:center;color:var(--mu);padding:60px 0}
@media(max-width:820px){.hero{grid-template-columns:1fr}.lead{min-height:320px}.mast{flex-direction:column;text-align:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#sp{display:none}}
.av{width:26px;height:26px;border-radius:50%;filter:grayscale(1)}
.vb{font-size:11px;border:1px solid var(--ln);padding:1px 8px;text-transform:uppercase;letter-spacing:.06em}
.vb.ok{border-color:#fff;color:#fff}.vb.er{border-color:var(--rd);color:var(--rd)}
#ua{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top .btn{padding:4px 12px;font-size:13px}
.sk{aspect-ratio:4/3;background:linear-gradient(90deg,#111,#1c1c1c,#111);background-size:200% 100%;animation:sh 1.2s infinite;border:1px solid var(--ln)}
@keyframes sh{to{background-position:-200% 0}}
.cm{border-bottom:1px solid var(--ln);padding:12px 0}.cm p{font:400 16px/1.5 Barlow,sans-serif;margin:4px 0 8px}
.stat{flex:1;min-width:110px;text-align:center;margin:0}.stat b{display:block;font:800 34px/1 'Barlow Condensed'}
#skp{position:absolute;bottom:24px;right:20px;z-index:2}
.fog{position:absolute;inset:-20%;background:radial-gradient(40% 30% at 30% 60%,rgba(255,255,255,.07),transparent 70%),radial-gradient(35% 28% at 70% 40%,rgba(255,255,255,.06),transparent 70%);animation:fg 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes fg{to{transform:translate(8%,-4%) scale(1.15)}}
.ghost{position:absolute;width:160px;height:260px;border-radius:50% 50% 30% 30%;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent);filter:blur(18px);animation:gh 3.2s ease-in-out both;pointer-events:none}
@keyframes gh{0%{opacity:0;transform:translateX(-40vw)}50%{opacity:1}100%{opacity:0;transform:translateX(40vw)}}
#sp{animation:sp 7.5s forwards;background:radial-gradient(ellipse at 50% 40%,#1a1a1a,#000 70%)}
#sp .pg{position:absolute;z-index:-1;width:min(62vw,380px);aspect-ratio:3/4;background:repeating-linear-gradient(0deg,#cfcfcf 0 2px,transparent 2px 10px),#bdbdbd;filter:blur(1.5px) grayscale(1);opacity:0;animation:pgf 6s ease-out both;pointer-events:none}
#sp .p1{left:4%;top:10%;--r:-9deg}
#sp .p2{right:3%;top:22%;--r:7deg;animation-delay:.4s}
#sp .p3{left:30%;bottom:-8%;--r:-3deg;animation-delay:.8s}
@keyframes pgf{from{opacity:0;transform:translateY(70px) rotate(var(--r)) scale(.88)}40%{opacity:.1}to{opacity:.05;transform:translateY(-20px) rotate(var(--r)) scale(1)}}
#sp .ed{font:600 12px 'Barlow Condensed';letter-spacing:.5em;color:var(--mu);text-transform:uppercase;animation:up 1.2s .3s both}
#sp b{animation:ttl 2s .9s both}
@keyframes ttl{from{opacity:0;letter-spacing:.5em;filter:blur(6px)}to{opacity:1;filter:none}}
#sp .rl{display:block;width:min(60vw,340px);height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:scaleX(0);animation:rl 1.4s 2.4s forwards}
@keyframes rl{to{transform:scaleX(1)}}
#sp .wl{font:italic 600 clamp(20px,5vw,30px)/1.2 'Source Serif 4',Georgia,serif;animation:wl 1.6s 3.4s both}
@keyframes wl{from{opacity:0;filter:blur(8px);transform:translateY(10px)}}
#sp small#cr{animation:up 1.2s 4.6s both;letter-spacing:.35em}
</style>
</head>
<body>
<div id="sp"><div class="pg p1"></div><div class="pg p2"></div><div class="pg p3"></div><button class="btn g" id="skp">Pular introdução</button><img id="spl" alt=""><span class="ed">Edição especial · Broadcast</span><b>RCE · Jornal do Exército Brasileiro do Yso</b><i class="rl"></i><p class="wl">Bem-vindo ao Site de Jornal</p><small id="cr"></small></div>
<div class="top"><span id="dt"></span><span id="ua"></span></div>
<header class="mast"><img id="ml" alt="Brasão"><div><small>Broadcast</small><h1>RCE Jornal do Exército Brasileiro do Yso</h1></div></header>
<nav id="nv" aria-label="Seções"></nav>
<div class="tk" id="tk"><b>Última hora</b><div id="tkc"></div></div>
<main id="app"></main>
<footer>RCE Jornal do Exército Brasileiro do Yso · Divisão de Comunicação · Conteúdo ficcional de comunidade Roblox</footer>
<div id="ts" role="status"></div>
<script>
const C={url:'https://cxpchabibhpwfhqegsqu.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cGNoYWJpYmhwd2ZocWVnc3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNjI1ODQsImV4cCI6MjEwNjczODU4NH0.Y04gJXJHDx9WbBrc3LDDiBpjb1XyLqxwnN9od2iAF0U',logo:'https://i.ibb.co/7BLTPVG/file-00000000a454820e9f7a7b5735e6e8e7.png',credits:'Urahara',fn:'discord-verify'};
const CATS=['Operações','Entrevistas','Crônicas de Batalha','Opinião','Comunicados'];
const $=s=>document.querySelector(s);
const PL={admin:'Administrador',jornalista:'Jornalista'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const su=u=>typeof u==='string'&&/^https:\/\//i.test(u)?esc(u):'';
const fd=d=>new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const ok=C.url.startsWith('https://')&&!C.key.startsWith('SUA_');
const sb=ok?supabase.createClient(C.url,C.key):null;
let A=[],P=null,U=null,V=null,busy=false,shown=12;
const DEMO=[
['d1','Operações','Operação Aurora neutraliza avanço inimigo no setor norte','Tropas do 1º Batalhão cumpriram missão de contenção em tempo recorde.','Após três horas de combate, o setor norte foi reestabelecido sob controle da Eb. O comandante da operação destacou a disciplina da tropa e a coordenação entre as companhias.\nA ação contou com apoio de blindados e reconhecimento aéreo.',true,true,420],
['d2','Entrevistas','"A disciplina vence qualquer batalha", afirma General em entrevista exclusiva','O Comandante-Geral fala sobre o futuro da instituição.','Em conversa com a Divisão de Comunicação, o General detalhou os planos de treinamento e os desafios para o próximo ciclo.\nSegundo ele, a formação de novos oficiais segue como prioridade absoluta.',false,false,310],
['d3','Crônicas de Batalha','A noite em que a ponte resistiu','Relato da defesa que entrou para a história da corporação.','Eram duas da manhã quando o primeiro alerta soou. Em minutos, os soldados ocupavam suas posições.\nA ponte, que parecia perdida, resistiu até o amanhecer.',false,false,250],
['d4','Comunicados','Alistamento aberto para novas turmas','Inscrições seguem até o fim do mês.','A Divisão de Recrutamento informa que as inscrições estão abertas para todos os interessados em servir.',false,false,180],
['d5','Opinião','Por que o treinamento constante importa','Editorial da redação.','Tropa treinada é tropa preparada. Cada exercício reforça a confiança e a coordenação entre os membros.',false,false,90]
].map((a,i)=>({id:a[0],categoria:a[1],titulo:a[2],subtitulo:a[3],corpo:a[4],destaque:a[5],urgente:a[6],views:a[7],imagem:'',autor_nome:'Redação',publicado:true,criado:new Date(Date.now()-i*36e5*7).toISOString()}));
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}
async function verify(){
 try{const {data,error}=await sb.functions.invoke(C.fn);V=error||!data?{erro:true}:data}catch(e){V={erro:true}}
}
function userbar(){
 if(!U)return '<button class="btn" id="lgt">Entrar com Discord</button>';
 const b=V?(V.erro?'<span class="vb er">Falha na verificação</span>':V.membro?'<span class="vb ok">✓ Verificado</span>':'<span class="vb er">Fora do servidor</span>'):'<span class="vb">Verificando…</span>';
 return (V&&V.avatar&&/^https:\/\//.test(V.avatar)?'<img class="av" alt="" src="'+esc(V.avatar)+'">':'')+'<b>'+esc(V&&V.nome?V.nome:'Sessão ativa')+'</b>'+(P?'<span class="tag">'+esc(P.papel)+'</span>':'')+b+'<button class="btn g" id="lo2">Sair</button>'
}
async function login(){
 if(!sb){toast('Configure o Supabase no início do script.');return}
 const {error}=await sb.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin+location.pathname,scopes:'identify'}});
 if(error)toast('Falha ao iniciar o login.')
}
async function logout(){await sb.auth.signOut();U=null;P=null;V=null;location.hash='';draw()}
async function loadCm(id){
 const box=$('#cms');if(!box)return;
 const {data,error}=await sb.from('comentarios').select('*').eq('artigo_id',id).order('criado').limit(100);
 if(error||!data){box.innerHTML='';return}
 const adm=P&&P.papel==='admin';
 const form=V&&V.membro?'<div class="box"><textarea id="cmt" rows="3" maxlength="500" placeholder="Escreva um comentário" aria-label="Comentário"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="cms_b">Comentar</button></div></div>':'<div class="box mu">Entre com Discord e confirme sua participação no servidor para comentar.</div>';
 box.innerHTML='<h2 class="sec">Comentários ('+data.length+')</h2>'+form+data.map(c=>'<div class="cm"><b>'+esc(c.autor_nome)+'</b> <span class="mu">'+fd(c.criado)+'</span><p>'+esc(c.texto)+'</p>'+((U&&c.autor_id===U.id)||adm?'<button class="btn g" data-dc="'+esc(c.id)+'">Apagar</button>':'')+'</div>').join('');
 const b=$('#cms_b');
 if(b)b.onclick=async()=>{const t=$('#cmt').value.trim();if(t.length<2)return;b.disabled=true;const r=await sb.from('comentarios').insert({artigo_id:id,texto:t});if(r.error){toast(/devagar/.test(r.error.message)?'Aguarde alguns segundos.':'Não foi possível comentar.');b.disabled=false;return}loadCm(id)};
 box.querySelectorAll('[data-dc]').forEach(x=>x.onclick=async()=>{if(!confirm('Apagar comentário?'))return;await sb.from('comentarios').delete().eq('id',x.dataset.dc);loadCm(id)})
}
async function load(){
 if(!sb){A=DEMO;return}
 const {data,error}=await sb.from('artigos').select('*').order('criado',{ascending:false}).limit(200);
 if(error){toast('Erro ao carregar matérias.');A=[];return}
 A=data||[]
}
async function perfil(){
 P=null;V=null;
 if(!sb||!U)return;
 await verify();
 if(!V||!V.membro)return;
 const {data}=await sb.rpc('meu_perfil');
 if(data&&data.papel)P=data
}
function nav(){
 const h=location.hash;
 $('#nv').innerHTML='<a href="#" class="'+(h===''||h==='#'?'on':'')+'">Início</a>'+CATS.map(c=>'<a href="#c/'+encodeURIComponent(c)+'" class="'+(h==='#c/'+encodeURIComponent(c)?'on':'')+'">'+esc(c)+'</a>').join('')+'<a href="#painel" class="'+(h==='#painel'?'on':'')+'">'+(P?'Painel':'Redação')+'</a>';
 const ub=A.filter(a=>a.urgente&&a.publicado).slice(0,5);
 $('#tk').classList.toggle('on',ub.length>0);
 $('#tkc').innerHTML=ub.map(a=>'<a href="#m/'+esc(a.id)+'">'+esc(a.titulo)+'</a>').join('');
 $('#ua').innerHTML=userbar();
}
function card(a){return '<a class="cd" href="#m/'+esc(a.id)+'">'+(su(a.imagem)?'<img loading="lazy" alt="" src="'+su(a.imagem)+'">':'<div class="ph" style="padding:0"></div>')+'<div><span class="cat">'+esc(a.categoria)+'</span><h3>'+esc(a.titulo)+'</h3><p>'+esc(a.subtitulo)+'</p><span class="mu">'+fd(a.criado)+'</span></div></a>'}
function home(){
 const pub=A.filter(a=>a.publicado);
 if(!pub.length){return '<div class="emp">Nenhuma matéria publicada ainda.</div>'}
 const lead=pub.find(a=>a.destaque)||pub[0];
 const rest=pub.filter(a=>a!==lead);
 const top=[...pub].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5);
 return '<div class="sr"><input id="q" placeholder="Buscar matérias" aria-label="Buscar"><button class="btn" id="qb">Buscar</button></div>'+
 '<section class="hero"><a class="lead" href="#m/'+esc(lead.id)+'">'+(su(lead.imagem)?'<img alt="" src="'+su(lead.imagem)+'">':'')+'<div class="ov"><span class="cat">'+esc(lead.categoria)+'</span><h2>'+esc(lead.titulo)+'</h2><span class="mu">'+esc(lead.subtitulo)+'</span></div></a>'+
 '<aside class="side"><h3 class="t">Mais lidas</h3>'+top.map((a,i)=>'<div class="ml"><i>'+(i+1)+'</i><a href="#m/'+esc(a.id)+'">'+esc(a.titulo)+'</a></div>').join('')+'</aside></section>'+
 '<h2 class="sec">Últimas notícias</h2><div class="grid">'+rest.slice(0,shown).map(card).join('')+'</div>'+(rest.length>shown?'<div style="text-align:center;margin-top:24px"><button class="btn g" id="mr">Carregar mais</button></div>':'')
}
function cat(c){
 const l=A.filter(a=>a.publicado&&a.categoria===c);
 return '<h2 class="sec">'+esc(c)+'</h2>'+(l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<div class="emp">Nenhuma matéria nesta seção.</div>')
}
function busca(t){
 const q=t.toLowerCase();
 const l=A.filter(a=>a.publicado&&(a.titulo+' '+a.subtitulo+' '+a.corpo).toLowerCase().includes(q));
 return '<h2 class="sec">Resultados para "'+esc(t)+'"</h2>'+(l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<div class="emp">Nada encontrado.</div>')
}
async function mat(id){
 const a=A.find(x=>String(x.id)===id);
 if(!a)return '<div class="emp">Matéria não encontrada.</div>';
 if(sb){try{if(!sessionStorage.getItem('v'+id)){sessionStorage.setItem('v'+id,'1');sb.rpc('incrementar_views',{p_id:id})}}catch(e){}}
 const rl=A.filter(x=>x.publicado&&x.categoria===a.categoria&&x!==a).slice(0,3);const rel=rl.length?'<h2 class="sec" style="margin-top:40px">Leia também</h2><div class="grid">'+rl.map(card).join('')+'</div>':'';
 return '<article class="art"><span class="cat">'+esc(a.categoria)+'</span><h1>'+esc(a.titulo)+'</h1><p class="sub">'+esc(a.subtitulo)+'</p><div class="by">Por <b>'+esc(a.autor_nome)+'</b> <span class="tag">'+esc(PL[a.autor_papel]||'Jornalista')+'</span> · '+fd(a.criado)+' · '+Math.max(1,Math.ceil(String(a.corpo||'').split(/\s+/).length/200))+' min de leitura</div>'+(su(a.imagem)?'<img alt="" src="'+su(a.imagem)+'">':'')+String(a.corpo||'').split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')+'<div class="row"><a class="btn g" href="#">← Voltar</a><button class="btn g" id="cp">Copiar link</button></div></article>'+(sb?'<section class="art" id="cms" style="margin-top:34px"></section>':'')+rel
}
function painel(ed){
 if(!sb)return '<div class="box">Configure SUPABASE_URL e ANON_KEY no topo do script para ativar a redação.</div>';
 if(!U)return '<div class="box"><h2 class="sec">Redação</h2><p style="margin-bottom:14px" class="mu">Acesso restrito a jornalistas e administradores cadastrados.</p><button class="btn" id="lg">Entrar com Discord</button></div>';
 if(!P){const m=!V?'Verificando sua conta no Discord…':V.erro?'Não foi possível verificar sua participação no servidor do Discord. Tente novamente em instantes.':!V.membro?'Sua conta do Discord não está no servidor da comunidade.':'Sua conta não está cadastrada como jornalista ou administrador.';return '<div class="box"><h2 class="sec">Acesso negado</h2><p class="mu" style="margin-bottom:14px">'+m+'</p><button class="btn g" id="lo">Sair</button></div>'}
 const adm=P.papel==='admin';
 const mine=A.filter(a=>adm||a.autor_id===U.id);
 const st=adm?'<div class="row" style="margin-bottom:14px"><div class="box stat"><b>'+A.length+'</b>matérias</div><div class="box stat"><b>'+A.filter(a=>a.publicado).length+'</b>publicadas</div><div class="box stat"><b>'+A.filter(a=>!a.publicado).length+'</b>pendentes</div><div class="box stat"><b>'+A.reduce((n,a)=>n+(a.views||0),0)+'</b>visualizações</div></div>':'';
 const e=ed?A.find(x=>String(x.id)===ed):null;
 return '<div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 class="sec" style="border:0;margin:0">'+(adm?'Painel do Administrador':'Painel do Jornalista')+'</h2><button class="btn g" id="lo">Sair</button></div>'+
 st+'<div class="box"><h3 class="sec" style="font-size:18px">'+(e?'Editar matéria':'Nova matéria')+'</h3><input type="hidden" id="f_id" value="'+esc(e?e.id:'')+'">'+
 '<label for="f_t">Título</label><input id="f_t" maxlength="160" value="'+esc(e?e.titulo:'')+'">'+
 '<label for="f_s">Subtítulo</label><input id="f_s" maxlength="240" value="'+esc(e?e.subtitulo:'')+'">'+
 '<label for="f_c">Seção</label><select id="f_c">'+CATS.map(c=>'<option'+(e&&e.categoria===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select>'+
 '<label for="f_i">Link da imagem (https)</label><input id="f_i" maxlength="500" value="'+esc(e?e.imagem:'')+'">'+
 '<label for="f_b">Texto (um parágrafo por linha)</label><textarea id="f_b" rows="10" maxlength="20000">'+esc(e?e.corpo:'')+'</textarea>'+
 (adm?'<label class="ck"><input type="checkbox" id="f_p"'+(!e||e.publicado?' checked':'')+'> Publicada</label>':'<p class="mu" style="margin-top:12px">Sua matéria fica pendente até um administrador aprovar.</p>')+
 (adm?'<label class="ck"><input type="checkbox" id="f_d"'+(e&&e.destaque?' checked':'')+'> Destaque principal</label><label class="ck"><input type="checkbox" id="f_u"'+(e&&e.urgente?' checked':'')+'> Última hora</label>':'')+
 '<div class="row" style="margin-top:16px"><button class="btn" id="sv">'+(e?'Salvar alterações':'Publicar')+'</button>'+(e?'<a class="btn g" href="#painel">Cancelar</a>':'')+'</div></div>'+
 '<div class="box"><h3 class="sec" style="font-size:18px">'+(adm?'Todas as matérias':'Minhas matérias')+'</h3>'+(mine.length?mine.map(a=>'<div class="li"><div><b>'+esc(a.titulo)+'</b><br><span class="mu">'+esc(a.categoria)+' · '+esc(a.autor_nome)+' ('+esc(PL[a.autor_papel]||'Jornalista')+') · '+(a.views||0)+' views</span> '+(a.publicado?'':'<span class="tag r">pendente</span> ')+(a.urgente?'<span class="tag r">urgente</span>':'')+'</div><div class="row">'+(adm&&!a.publicado?'<button class="btn" data-ap="'+esc(a.id)+'">Aprovar</button>':'')+'<a class="btn g" href="#painel/'+esc(a.id)+'">Editar</a><button class="btn d" data-del="'+esc(a.id)+'">Apagar</button></div></div>').join(''):'<div class="emp">Nenhuma matéria ainda.</div>')+'</div>'
}
async function save(){
 if(busy)return;
 const g=i=>{const x=$('#'+i);return x?x.value.trim():''};
 const t=g('f_t'),b=g('f_b'),im=g('f_i');
 if(t.length<5||b.length<20){toast('Título (5+) e texto (20+ caracteres) são obrigatórios.');return}
 if(im&&!/^https:\/\//i.test(im)){toast('A imagem precisa começar com https://');return}
 const adm=P.papel==='admin';
 const row={titulo:t,subtitulo:g('f_s'),categoria:g('f_c'),imagem:im,corpo:b,publicado:adm?$('#f_p').checked:false};
 if(adm){row.destaque=$('#f_d').checked;row.urgente=$('#f_u').checked}
 busy=true;$('#sv').disabled=true;
 const id=g('f_id');
 let r;
 if(id)r=await sb.from('artigos').update(row).eq('id',id);
 else{row.autor_nome=P.nome;r=await sb.from('artigos').insert(row)}
 busy=false;
 if(r.error){toast('Falha ao salvar: '+r.error.message);$('#sv').disabled=false;return}
 toast(adm?'Matéria salva com sucesso.':'Matéria enviada para aprovação.');
 await load();location.hash='#painel'
}
async function del(id){
 if(!confirm('Apagar esta matéria definitivamente?'))return;
 const {error}=await sb.from('artigos').delete().eq('id',id);
 if(error){toast('Falha ao apagar.');return}
 toast('Matéria apagada.');await load();draw()
}
async function ap(id){
 if(busy)return;
 busy=true;
 const {error}=await sb.from('artigos').update({publicado:true}).eq('id',id);
 busy=false;
 if(error){toast('Falha ao aprovar.');return}
 toast('Matéria aprovada e publicada.');await load();draw()
}
async function draw(){
 const h=decodeURIComponent(location.hash||'');
 const app=$('#app');
 let html;
 if(h.startsWith('#m/'))html=await mat(h.slice(3));
 else if(h.startsWith('#c/'))html=cat(h.slice(3));
 else if(h.startsWith('#q/'))html=busca(h.slice(3));
 else if(h.startsWith('#painel'))html=painel(h.split('/')[1]||'');
 else html=home();
 app.style.animation='none';void app.offsetWidth;app.style.animation='';
 app.innerHTML=html;
 nav();
 window.scrollTo(0,0);
 const q=$('#q'),qb=$('#qb');
 if(qb){const go=()=>{const v=q.value.trim();if(v)location.hash='#q/'+encodeURIComponent(v)};qb.onclick=go;q.onkeydown=e=>{if(e.key==='Enter')go()}}
 const lg=$('#lg');if(lg)lg.onclick=login;const lt=$('#lgt');if(lt)lt.onclick=login;const l2=$('#lo2');if(l2)l2.onclick=logout;const mr=$('#mr');if(mr)mr.onclick=()=>{const y=scrollY;shown+=12;draw().then(()=>scrollTo(0,y))};const cp=$('#cp');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Link copiado.')}catch(e){toast('Não foi possível copiar.')}};if(h.startsWith('#m/')&&sb)loadCm(h.slice(3));
 const lo=$('#lo');if(lo)lo.onclick=logout;
 const sv=$('#sv');if(sv)sv.onclick=save;
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del));
 document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>ap(b.dataset.ap))
}
async function init(){
 $('#spl').src=C.logo;$('#ml').src=C.logo;
 if(C.credits)$('#cr').textContent='Criado por '+C.credits;
 try{if(localStorage.getItem('nosp'))$('#sp').style.display='none'}catch(e){}
 $('#skp').onclick=()=>{$('#sp').style.display='none';try{localStorage.setItem('nosp','1')}catch(e){}};
 $('#app').innerHTML='<div class="grid">'+'<div class="sk"></div>'.repeat(6)+'</div>';
 document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.closest('main'))e.target.style.display='none'},true);
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const q=$('#q');if(q){e.preventDefault();q.focus()}}});
 setInterval(()=>{if(U&&sb)verify()},144e5);
 $('#dt').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 if(sb){
  const {data}=await sb.auth.getSession();
  U=data.session?data.session.user:null;
  await perfil();
  sb.auth.onAuthStateChange(async(ev,s)=>{const nu=s?s.user:null;if((nu&&nu.id)!==(U&&U.id)){U=nu;await perfil();await load();draw()}})
 }
 await load();
 window.addEventListener('hashchange',draw);
 draw()
}
window.addEventListener('unhandledrejection',e=>{e.preventDefault();toast('Ocorreu um erro. Tente novamente.')});
init();
</script>
</body>
</html>
