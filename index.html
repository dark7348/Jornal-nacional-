async function corpo(a){
 if(a.corpo!==undefined)return a.corpo;
 if(!sb)return '';
 const {data,error}=await sb.from('artigos').select('corpo').eq('id',a.id).maybeSingle();
 if(error||!data)return null;
 a.corpo=data.corpo||'';
 return a.corpo
}
async function busca(t){
 const q=t.toLowerCase();
 const c=t.replace(/[%,()*\\]/g,' ').trim();
 let l;
 if(sb){
  const {data}=c?await sb.from('artigos').select(LC).eq('publicado',true).or('titulo.ilike.%'+c+'%,subtitulo.ilike.%'+c+'%,corpo.ilike.%'+c+'%').order('criado',{ascending:false}).limit(30):{data:[]};
  l=data||[]
 }else l=A.filter(a=>a.publicado&&(a.titulo+' '+a.subtitulo+' '+a.corpo).toLowerCase().includes(q));
 return '<h2 class="sec">Resultados para "'+esc(t)+'"</h2>'+(l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<div class="emp">Nada encontrado.</div>')
}
async function mat(id){
 let a=A.find(x=>String(x.id)===id);
 if(!a&&sb){const q=await sb.from('artigos').select(LC).eq('id',id).maybeSingle();a=q.data;if(a)A.push(a)}
 if(!a)return '<div class="emp">Matéria não encontrada.</div>';
 const cb=await corpo(a);
 if(cb===null)return '<div class="emp">Não foi possível carregar esta matéria. Verifique a conexão e tente de novo.</div>';
 if(sb){try{if(!sessionStorage.getItem('v'+id)){sessionStorage.setItem('v'+id,'1');sb.rpc('incrementar_views',{p_id:id})}}catch(e){}}
 const rl=A.filter(x=>x.publicado&&x.categoria===a.categoria&&x!==a).slice(0,3);const rel=rl.length?'<h2 class="sec" style="margin-top:40px">Leia também</h2><div class="grid">'+rl.map(card).join('')+'</div>':'';
 return '<article class="art"><span class="cat">'+esc(a.categoria)+'</span><h1>'+esc(a.titulo)+'</h1><p class="sub">'+esc(a.subtitulo)+'</p><div class="by">Por <b>'+esc(a.autor_nome)+'</b> <span class="tag">'+esc(PL[a.autor_papel]||'Jornalista')+'</span> · '+fd(a.criado)+' · '+Math.max(1,Math.ceil(String(cb||'').split(/\s+/).length/200))+' min de leitura</div>'+(su(a.imagem)?'<img alt="" src="'+su(a.imagem)+'">':'')+String(cb||'').split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')+'<div class="row"><a class="btn g" href="#">← Voltar</a><button class="btn g" id="cp">Copiar link</button></div></article>'+(sb?'<section class="art" id="cms" style="margin-top:34px"></section>':'')+rel
}

 '<div class="box"><h3 class="sec" style="font-size:18px">'+(e?'Editar matéria':'Nova matéria')+'</h3><input type="hidden" id="f_id" value="'+esc(e?e.id:'')+'">'+

}
async function save(){
 if(busy)return;
 const g=i=>{const x=$('#'+i);return x?x.value.trim():''};
 const t=g('f_t'),b=g('f_b'),im=g('f_i');
 if(t.length<5||b.length<20){toast('Título (5+) e texto (20+ caracteres) são obrigatórios.');return}
 if(im&&!/^https:\/\//i.test(im)){toast('A imagem precisa começar com https://');return}
 const adm=P.papel==='admin';
 const row={titulo:t,subtitulo:g('f_s'),categoria:g('f_c'),imagem:im,corpo:b,publicado:adm?$('#f_p').checked:false};
 if(adm){row.destaque=$('#f_d').checked;row.urgente=$('#f_u').checked}
 busy=true;$('#sv').disabled=true;
 const id=g('f_id');
 let r;
 if(id)r=await sb.from('artigos').update(row).eq('id',id);
 else{row.autor_nome=P.nome;r=await sb.from('artigos').insert(row)}
 busy=false;
 if(r.error){toast('Falha ao salvar: '+r.error.message);$('#sv').disabled=false;return}
 toast(adm?'Matéria salva com sucesso.':'Matéria enviada para aprovação.');
 try{if(!id)localStorage.removeItem('rasc')}catch(e){}
 await load();location.hash='#posts'
}
async function del(id){
 if(!confirm('Apagar esta matéria definitivamente?'))return;
 const {error}=await sb.from('artigos').delete().eq('id',id);
 if(error){toast('Falha ao apagar.');return}
 toast('Matéria apagada.');await load();draw()
}

 toast('Matéria aprovada e publicada.');await load();draw()
}
